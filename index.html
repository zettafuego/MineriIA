<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FormalizaAI — Diagnóstico y plan de formalización minera en Perú" />
  <title>FormalizaAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <script>
    // Redirección inmediata según sesión
    (function () {
      try {
        const raw = localStorage.getItem('formalizaai_session');
        if (raw && JSON.parse(raw)?.id) {
          location.replace('dashboard.html');
        } else {
          location.replace('login.html');
        }
      } catch {
        location.replace('login.html');
      }
    })();
  </script>
</head>
<body>
  <p style="text-align:center;padding:2rem;font-family:system-ui">Cargando FormalizaAI…</p>
</body>
</html>
